<!-- Home Page: Home Seite der Anwendung -->
<!DOCTYPE html>
<html lang="de-CH">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Ready Set Dinner</title>
  <link rel="icon" type="image/png" href="resources/assets/icons/bell.svg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app_body">
  <div id="top_nav_container"></div>
  
  <main class="app_main">
    <header class="page_header">
      <h1>Ready Set Dinner</h1>
      <p class="subtitle">Press the buzzer when dinner is ready!</p>
    </header>

    <div class="call_container">
      <div class="active_goal_container">
        <div id="active_goal_area"></div>
      </div>

      <div class="dinner_call_container">
          <button id="start_round_btn" class="btn btn_primary call_button" type="button">
            <img src="resources/assets/icons/bell.svg" alt="Dinner Bell Icon">
            <span>Start Dinner Call</span>
          </button>   

        <div id="timer_card" class="timer_card">
          <div id="timer_display" class="timer_display">0:00.00</div>
          <div class="progress_bar timer_bar">
            <div id="timer_fill" class="progress_fill timer_fill"></div>
          </div>

          <button id="reset_timer_btn" class="btn btn_secondary timer_reset" type="button">
            Reset
          </button>
        </div>

        <section id="buzzer_panel" class="buzzer_panel">
          <h2>Press Your Buzzer</h2>
          <div id="buzzer_grid" class="buzzer_grid"></div>
        </section>
      </div> 
    </div>
  </main>


  <div id="bottom_nav_container"></div>
  <script src="js/bottom-nav.js"></script>
  <script src="js/top-nav.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/home.js"></script>
  <script src="js/logout.js"></script>
</body>

</html>
