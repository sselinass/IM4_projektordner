<!-- Family Page: Verwaltung der Familienmitglieder -->
<!DOCTYPE html>
<html lang="de-CH">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family | Ready Set Dinner</title>
    <link rel="icon" type="image/png" href="resources/assets/icons/bell.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app_body">
    <div id="top_nav_container"></div>
    <main class="app_main_family_page">

        <header class="page_header">
            <h1>Family</h1>
            <p class="subtitle">Add your family members and assign a buzzer color.</p>
        </header>

        <div id="family_members" class="family_members"></div>

        <button id="add_member_button" class="btn btn_secondary add_member_button" type="button">
            + Add Member
        </button>

        <button id="change_family_button" class="btn btn_secondary change_family_button" type="button">
            Logout to Change Family
        </button>

    </main>


    <!-- popup -->

    <div id="member_modal" class="member_modal is_hidden">

        <div class="member_modal_card">
            <div class="member_modal_header">
                <h2>New Family Member</h2>
            </div>

            <form id="member_form">
                <div class="form_group">
                    <label for="member_name"> Name </label>
                    <input id="member_name" type="text" maxlength="30" required>
                </div>

                <div class="form_group">
                    <label>Select Icon</label>
                    <div id="icon_selection" class="icon_selection"></div>
                </div>

                <div class="form_group">
                    <label> Select Color</label>
                    <div class="color_selection">
                        <button type="button" class="color_button blue" data-color="blue"></button>
                        <button type="button" class="color_button pink" data-color="pink"></button>
                        <button type="button" class="color_button green" data-color="green"></button>
                        <button type="button" class="color_button orange" data-color="orange"></button>
                    </div>
                </div>

                <div class="member_modal_actions">
                    <button type="button" id="cancel_member_button" class="btn btn_secondary">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn_primary">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="delete_member_modal" class="member_modal is_hidden" role="dialog" aria-modal="true"
        aria-labelledby="delete_member_title">
        <div class="delete_modal_card">
            <h2 id="delete_member_title">Delete Family Member?</h2>

            <p id="delete_member_text" class="delete_modal_text">
                Do you really want to delete this family member?
            </p>

            <div class="delete_modal_actions">
                <button type="button" id="cancel_delete_member_button" class="btn btn_secondary">
                    Cancel
                </button>

                <button type="button" id="confirm_delete_member_button" class="btn btn_primary delete_confirm_button">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <div id="bottom_nav_container"></div>
    <script src="js/top-nav.js"></script>

    <script src="js/bottom-nav.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/family.js"></script>

</body>

</html>
