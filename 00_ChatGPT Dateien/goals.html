<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals | Ready Set Dinner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app_body">
  <main class="app_main">
    <header class="page_header">
      <h1>Family Goals</h1>
      <p class="subtitle">Manage your family's reward goals</p>
    </header>

    <section id="active_goal_area"></section>

    <section class="goal_actions">
      <button id="collect_goal_btn" class="btn btn_primary collect_button" type="button">
        Collect Now
      </button>
    </section>

    <h2 class="section_title">Future Goals</h2>

    <section id="future_goals_list" class="goals_list"></section>

    <button id="show_goal_form_btn" class="btn add_goal_button" type="button">
      <span>＋</span>
      <span>Add Goal</span>
    </button>

    <section id="goal_form_card" class="goal_form_card">
      <h2>New Goal</h2>

      <form id="goal_form" class="goal_form">
        <input
          type="text"
          id="goal_title"
          class="form_input"
          maxlength="50"
          placeholder="Goal title (e.g., 'Theme Park Visit')"
          required
        >

        <input
          type="number"
          id="goal_points_required"
          class="form_input"
          min="1"
          step="1"
          placeholder="Points required"
          required
        >

        <div class="goal_form_actions">
          <button class="btn btn_primary" type="submit">Save</button>
          <button id="cancel_goal_form_btn" class="btn btn_secondary" type="button">Cancel</button>
        </div>
      </form>
    </section>

    <p id="goals_message" class="app_message"></p>
  </main>

  <nav class="bottom_nav" aria-label="Main navigation">
    <a class="nav_link" href="home.html">
      <span class="nav_icon">⌂</span>
      <span>Home</span>
    </a>
    <a class="nav_link is_active" href="goals.html">
      <span class="nav_icon">◎</span>
      <span>Goals</span>
    </a>
    <a class="nav_link" href="#">
      <span class="nav_icon">♧</span>
      <span>Family</span>
    </a>
    <a class="nav_link" href="#">
      <span class="nav_icon">▥</span>
      <span>Stats</span>
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script src="js/goals.js"></script>
</body>
</html>
