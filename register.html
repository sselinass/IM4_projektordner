<!DOCTYPE html>
<html lang="de-CH">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Ready Set Dinner</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth_page">
    <section class="auth_card register_card">

      <a href="index.html">
        <img src="resources/assets/DinnerBell.svg" alt="Rennende Essensglocke" class="hero_image">
      </a>

      <h1>Register</h1>
      <p class="subtitle">Please register to continue</p>

      <form id="register_form" class="form_area">
        <p id="form_message" class="form_message"></p>
        <input type="email" id="email" name="email" class="form_input" placeholder="Email" required>

        <input type="password" id="password" name="password" class="form_input" placeholder="Password" required>

        <button type="submit" class="btn btn_primary">
          Register
        </button>

        <a href="login.html" class="register_hint">
          Already registered?
        </a>
      </form>

    </section>
  </main>

  <script src="js/register.js"></script>
</body>

</html>
